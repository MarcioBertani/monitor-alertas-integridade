<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Alertas de Integridade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0e9;--surface:#fbfaf6;--surface-2:#ebe7dd;--line:#d6d0c2;--line-strong:#b9b2a0;
  --ink:#1d2330;--ink-2:#4b5262;--ink-3:#6c7283;--accent:#1c4f7c;--accent-ink:#ffffff;--accent-soft:#dbe6f0;--focus:#b5560b;
  --crit:#a8182e;--crit-bg:#f5dadd;--alto:#b4560a;--alto-bg:#f6e2cd;--medio:#8a6a00;--medio-bg:#f3e8b9;--baixo:#3d6b57;--baixo-bg:#dcebe2;
  --neutral:#8b8678;--sel:#e4ebf2;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171b24;--surface:#1e232e;--surface-2:#262c39;--line:#323a4a;--line-strong:#47506a;
  --ink:#e8e6df;--ink-2:#b4b8c4;--ink-3:#8e94a4;--accent:#7fb0dc;--accent-ink:#10161f;--accent-soft:#243649;--focus:#f0a05a;
  --crit:#ff8a98;--crit-bg:#4a2229;--alto:#f2a35e;--alto-bg:#47301b;--medio:#e3c458;--medio-bg:#40371a;--baixo:#7fc4a0;--baixo-bg:#1f3a2e;
  --neutral:#6b7285;--sel:#27303f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171b24;--surface:#1e232e;--surface-2:#262c39;--line:#323a4a;--line-strong:#47506a;
  --ink:#e8e6df;--ink-2:#b4b8c4;--ink-3:#8e94a4;--accent:#7fb0dc;--accent-ink:#10161f;--accent-soft:#243649;--focus:#f0a05a;
  --crit:#ff8a98;--crit-bg:#4a2229;--alto:#f2a35e;--alto-bg:#47301b;--medio:#e3c458;--medio-bg:#40371a;--baixo:#7fc4a0;--baixo-bg:#1f3a2e;
  --neutral:#6b7285;--sel:#27303f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-inline:16px;max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 0 6px}
header.top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.005em}
.sub-h{color:var(--ink-3);font-size:12px;min-width:0}
.hbtn{margin-left:auto;align-self:center}
.nav{display:flex;border-bottom:1px solid var(--line)}
.nav .tab{font-size:14px;padding:8px 16px 7px}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px 6px;cursor:pointer;color:var(--ink-2);white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.tab .c{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;margin-left:5px;color:var(--ink-3)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.filters{display:flex;flex-direction:column;gap:8px;padding:8px 0 10px;border-bottom:1px solid var(--line)}
.row-f{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.fld select,.fld input{background:var(--surface);border:1px solid var(--line-strong);border-radius:2px;padding:6px 8px;min-width:0;width:100%;height:34px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);border-inline:1px solid var(--line)}
.listwrap,.detail{min-width:0;min-height:0;overflow:auto;background:var(--surface)}
.listwrap{border-right:1px solid var(--line)}
.detail{background:var(--bg);padding:16px 20px 28px}
.meta-line{padding:6px 12px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:1}
ul.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:5px minmax(0,1fr);width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:0;cursor:pointer}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--sel);box-shadow:inset 0 0 0 1px var(--line-strong)}
.stripe{background:var(--sev)}
.item .body{padding:8px 12px;display:grid;gap:3px;min-width:0}
.l1,.l2,.l3{display:flex;align-items:baseline;gap:8px;min-width:0}
.l1 .match{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.l1 .dt{flex:none;font:500 11.5px var(--mono);color:var(--ink-2)}
.l2,.l3{font-size:12px;color:var(--ink-2)}
.l2 span,.l3 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3 .mk{font-family:var(--mono);font-size:11.5px}
.sep{color:var(--line-strong);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:17px}
.chip{font:500 10.5px var(--mono);border:1px solid var(--line-strong);padding:0 5px;line-height:17px;color:var(--ink-2);background:var(--surface)}
.chip.c-ana{color:var(--crit);background:var(--crit-bg);border-color:var(--crit)}
.chip.c-sus{color:var(--alto);background:var(--alto-bg);border-color:var(--alto)}
.chip.c-apo{color:var(--medio);background:var(--medio-bg);border-color:var(--medio)}
.chip.c-nof{color:var(--ink-2)}
.chip.c-sem{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
[data-p="1"]{--sev:var(--crit)}[data-p="2"]{--sev:var(--alto)}[data-p="3"]{--sev:var(--medio)}[data-p="4"]{--sev:var(--accent)}[data-p="5"]{--sev:var(--neutral)}
.empty{padding:32px 16px;color:var(--ink-2);text-align:center}
.empty button{margin-top:8px}
.back{display:none;margin-bottom:10px}
.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:2px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.d-head{border-left:5px solid var(--sev);padding-left:12px;margin-bottom:14px;min-width:0}
.d-head .top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--ink-3)}
.pri{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;color:var(--sev);border:1px solid var(--sev)}
.d-head h2{margin:4px 0 2px;font-size:20px;line-height:1.25;overflow-wrap:anywhere;letter-spacing:-.01em}
.d-head .sub{color:var(--ink-2);overflow-wrap:anywhere}
dl.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 8px;border:1px solid var(--line);background:var(--surface)}
dl.grid>div{padding:8px 12px;border-bottom:1px solid var(--line);min-width:0}
dl.grid>div:nth-child(odd){border-right:1px solid var(--line)}
dl.grid>div.full{grid-column:1/-1;border-right:0}
dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
dd{margin:1px 0 0;overflow-wrap:anywhere}
.mid{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mid .mono{user-select:all}
.btn.sm{min-height:26px;padding:1px 8px;font-size:12px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:18px 0 8px;font-weight:600}
.analise{background:var(--surface);border:1px solid var(--line);padding:4px 14px;max-width:72ch}
.analise p{margin:10px 0;line-height:1.55;overflow-wrap:anywhere}
.analise.none{color:var(--ink-3);font-style:italic;padding:10px 14px}
.act-row{display:flex;flex-wrap:wrap;gap:6px 14px}
.act{display:grid;gap:4px}
.act .lb{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
textarea{width:100%;min-height:100px;resize:vertical;background:var(--surface);border:1px solid var(--line-strong);border-radius:2px;padding:8px 10px;line-height:1.45}
.hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.kbd{font:500 11px var(--mono);border:1px solid var(--line-strong);padding:0 4px;background:var(--surface)}
.toast{font-size:12px;color:var(--ink-2);min-height:18px;margin-top:6px}
/* overview */
.geral{flex:1;min-height:0;overflow:auto;padding:12px 0 32px}
.geral .bar-f{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.geral .bar-f .fld{width:200px;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);padding:10px 12px;min-width:0}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.kpi .v{font:600 26px/1.15 var(--mono);margin-top:2px}
.kpi .p{font-size:12px;color:var(--ink-3)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);padding:12px 14px;min-width:0}
.card h3{margin:0 0 2px}
.card .note{font-size:12px;color:var(--ink-3);margin:0 0 8px}
.card svg{display:block;width:100%;max-width:480px;height:auto}
.ct{fill:var(--ink-2);font:11px var(--mono)}
.cv{fill:var(--ink);font:600 11px var(--mono)}
.cb{fill:var(--accent)}
.cb.mute{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1}
.cb.part{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.cb.oth{fill:var(--neutral)}
.cbase{stroke:var(--line-strong);stroke-width:1}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,12,18,.55)}
.dlg{padding:16px;display:grid;gap:10px}
.dlg h2{margin:0;font-size:16px}
.dlg p{margin:0;color:var(--ink-2)}
.dlg textarea{min-height:240px;font:12px/1.5 var(--mono)}
.dlg .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:1100px){.row-f{grid-template-columns:repeat(3,minmax(0,1fr))}.row-f .fld:first-child{grid-column:1/-1}}
@media (max-width:820px){
  .app{display:block;height:auto}
  .view{display:block}
  .main{display:block;border-inline:0}
  .listwrap,.detail{overflow:visible}
  .listwrap{border-right:0}
  .meta-line{position:static}
  .detail{display:none;padding:12px 0 28px;background:var(--bg)}
  .app[data-view="detail"] .listwrap{display:none}
  .app[data-view="detail"] .detail{display:block}
  .app[data-view="detail"] .filters,.app[data-view="detail"] header.top,.app[data-view="detail"] .nav{display:none}
  .back{display:inline-block}
  .row-f{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .hint.kbd-hint{display:none}
  .geral{overflow:visible}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hbtn{margin-left:0}
}
@media (max-width:460px){
  dl.grid{grid-template-columns:minmax(0,1fr)}
  dl.grid>div:nth-child(odd){border-right:0}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-motion:no-preference){.item,.btn{transition:background .12s}}
</style>
</head>
<body>

<div class="app" id="app" data-view="list">
  <header class="top">
    <h1>Monitor de Alertas de Integridade</h1>
    <span class="sub-h" id="subh"></span>
    <button class="btn hbtn" type="button" id="chg-btn" aria-haspopup="dialog">Alterações nesta sessão (0)</button>
  </header>
  <div class="nav" role="tablist" id="nav" aria-label="Seções">
    <button class="tab" role="tab" id="nav-t" data-nav="t" aria-selected="true" aria-controls="view-t">Triagem</button>
    <button class="tab" role="tab" id="nav-g" data-nav="g" aria-selected="false" aria-controls="view-g">Visão geral</button>
  </div>

  <div class="view" id="view-t" role="tabpanel" aria-labelledby="nav-t">
    <section class="filters" aria-label="Filtros">
      <div class="tabs" role="tablist" id="tabs" aria-label="Status"></div>
      <div class="row-f">
        <div class="fld"><label for="q">Buscar</label><input id="q" type="search" placeholder="Evento, campeonato, país, match id" autocomplete="off"></div>
        <div class="fld"><label for="f-mes">Mês</label><select id="f-mes"></select></div>
        <div class="fld"><label for="f-esporte">Esporte</label><select id="f-esporte"></select></div>
        <div class="fld"><label for="f-sus">Suspeito?</label><select id="f-sus"></select></div>
        <div class="fld"><label for="f-apo">Com aposta?</label><select id="f-apo"></select></div>
        <div class="fld"><label for="f-ofe">Ofertado?</label><select id="f-ofe"></select></div>
      </div>
    </section>
    <div class="main">
      <section class="listwrap" id="listwrap" aria-label="Fila de alertas">
        <div class="meta-line" id="meta"></div>
        <ul class="list" id="list"></ul>
      </section>
      <section class="detail" id="detail" aria-label="Detalhe do alerta" aria-live="polite"></section>
    </div>
  </div>

  <div class="view geral" id="view-g" role="tabpanel" aria-labelledby="nav-g" hidden>
    <div class="bar-f"><div class="fld"><label for="g-mes">Período (mês)</label><select id="g-mes"></select></div><span class="hint" id="g-hint"></span></div>
    <div class="kpis" id="kpis"></div>
    <div class="charts" id="charts"></div>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-t">
  <div class="dlg">
    <h2 id="dlg-t">Alterações nesta sessão</h2>
    <p>Esta página não grava na planilha do Google Sheets: copie o texto abaixo e atualize a planilha manualmente.</p>
    <label for="chg-text" class="hint" style="margin:0">Texto das alterações</label>
    <textarea id="chg-text" readonly></textarea>
    <div class="actions"><button class="btn primary" type="button" id="chg-copy">Copiar texto</button><button class="btn" type="button" id="chg-close">Fechar</button><span class="toast" id="chg-toast" role="status"></span></div>
  </div>
</dialog>

<script>

function select(i,o){
  const prev=document.querySelector('.item[aria-current="true"]');
  if(prev) prev.setAttribute('aria-current','false');
  state.sel=i;
  const b=document.querySelector('.item[data-i="'+i+'"]');
  if(b){b.setAttribute('aria-current','true');if(o&&o.focus)b.focus({preventScroll:true});b.scrollIntoView({block:'nearest'});}
  renderDetail();
}
function showDetail(){$('app').dataset.view='detail';window.scrollTo(0,0);$('detail').scrollTop=0;const bk=$('back');if(bk&&getComputedStyle(bk).display!=='none')bk.focus();}
function showList(){$('app').dataset.view='list';const b=document.querySelector('.item[aria-current="true"]');if(b){b.focus({preventScroll:true});b.scrollIntoView({block:'nearest'});}}

async function copyText(text,srcEl,toastFn){
  try{
    await navigator.clipboard.writeText(text);
    toastFn('Copiado.');return;
  }catch(e){}
  try{
    if(srcEl.select){srcEl.focus();srcEl.select();}
    else{const r=document.createRange();r.selectNodeContents(srcEl);const s=getSelection();s.removeAllRanges();s.addRange(r);}
    const ok=document.execCommand&&document.execCommand('copy');
    toastFn(ok?'Copiado.':'Texto selecionado: use Ctrl+C para copiar.');
  }catch(e){toastFn('Texto selecionado: use Ctrl+C para copiar.');}
}

/* events: triagem */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;renderAll();$('tab-'+state.tab).focus();});
$('tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const t=['ea','arq','todos'];let i=(t.indexOf(state.tab)+(e.key==='ArrowRight'?1:-1)+3)%3;
  state.tab=t[i];renderAll();$('tab-'+state.tab).focus();e.preventDefault();
});
$('q').addEventListener('input',e=>{state.q=e.target.value.trim();renderTabs();renderList();renderDetail();});
[['f-mes','mes'],['f-esporte','esporte'],['f-sus','sus'],['f-apo','apo'],['f-ofe','ofe']].forEach(([id,k])=>$(id).addEventListener('change',e=>{state[k]=e.target.value;renderAll();}));
$('list').addEventListener('click',e=>{
  if(e.target.id==='clear'){Object.assign(state,{tab:'todos',mes:'',esporte:'',sus:'',apo:'',ofe:'',q:''});$('q').value='';initFilters();renderAll();return;}
  const b=e.target.closest('.item');if(!b)return;
  select(+b.dataset.i);showDetail();
});
$('detail').addEventListener('click',e=>{
  if(e.target.closest('#back')){showList();return;}
  const a=data[state.sel];if(!a)return;
  if(e.target.closest('#copy-mid')){copyText(a.match_id,$('mid'),toast);return;}
  const s=e.target.closest('[data-set]');
  if(s){
    const k=s.dataset.set;a[k]=s.dataset.v;
    const id=s.id;
    renderTabs();renderList(true);renderDetail();updChg();
    toast('Alterado: '+({status:'Status',suspeito:'Suspeito?',com_aposta:'Com aposta?'})[k]+' = '+a[k]+'.');
    const nb=$(id);if(nb)nb.focus();
  }
});
$('detail').addEventListener('input',e=>{if(e.target.id==='notas'&&state.sel!=null){notes[state.sel]=e.target.value;updChg();}});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if($('dlg').open||$('view-t').hidden)return;
  const tg=e.target,tag=tg.tagName;
  if(e.key==='Escape'&&$('app').dataset.view==='detail'){showList();return;}
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(e.key==='j'||e.key==='k'){
    if($('app').dataset.view==='detail'&&getComputedStyle($('listwrap')).display==='none')return;
    const L=state.list;if(!L.length)return;
    let i=L.findIndex(a=>a.i===state.sel);
    i=Math.max(0,Math.min(L.length-1,i+(e.key==='j'?1:-1)));
    select(L[i].i,{focus:true});e.preventDefault();
  }else if(e.key==='Enter'){
    if(tag==='BUTTON'&&!tg.classList.contains('item'))return;
    if(state.sel!=null){if(tg.classList.contains('item')&&+tg.dataset.i!==state.sel)select(+tg.dataset.i);showDetail();e.preventDefault();}
  }
});

/* changes dialog */
function changesText(){
  const ch=data.filter(changed);
  if(!ch.length) return 'Nenhuma alteração nesta sessão.';
  const lines=['Alterações para a planilha ('+ch.length+' alerta'+(ch.length>1?'s':'')+')',''];
  ch.forEach(a=>{
    lines.push(a.mes+' · nº '+a.n+' · '+a.evento+' · match id '+(a.match_id||'sem match id'));
    if(a.status!==a.o.status) lines.push('  Status: '+(a.o.status||'—')+' -> '+a.status);
    if(a.suspeito!==a.o.suspeito) lines.push('  Suspeito?: '+(a.o.suspeito||'—')+' -> '+a.suspeito);
    if(a.com_aposta!==a.o.com_aposta) lines.push('  Com aposta?: '+(a.o.com_aposta||'—')+' -> '+a.com_aposta);
    const n=(notes[a.i]||'').trim(); if(n) lines.push('  Notas: '+n.replace(/\s*\n\s*/g,' / '));
    lines.push('');
  });
  return lines.join('\n').trim();
}
$('chg-btn').addEventListener('click',()=>{
  $('chg-text').value=changesText();$('chg-toast').textContent='';
  const d=$('dlg');
  if(d.showModal) d.showModal(); else d.setAttribute('open','');
  $('chg-copy').focus();
});
$('chg-close').addEventListener('click',()=>{const d=$('dlg');if(d.close)d.close();else d.removeAttribute('open');$('chg-btn').focus();});
$('chg-copy').addEventListener('click',()=>copyText($('chg-text').value,$('chg-text'),t=>{$('chg-toast').textContent=t;}));

/* nav */
function setNav(k){
  $('nav-t').setAttribute('aria-selected',k==='t');$('nav-g').setAttribute('aria-selected',k==='g');
  $('view-t').hidden=k!=='t';$('view-g').hidden=k!=='g';
  if(k==='g') renderGeral();
}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)setNav(b.dataset.nav);});
$('nav').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const k=$('nav-t').getAttribute('aria-selected')==='true'?'g':'t';setNav(k);$('nav-'+k).focus();e.preventDefault();
});
$('g-mes').addEventListener('change',renderGeral);

/* overview */
const W=360;
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function hbars(items,label){
  if(!items.length||!items.some(x=>x.v>0)) return '<p class="note">Sem dados no período.</p>';
  const max=Math.max(...items.map(x=>x.v)),X0=124,BW=190,RH=24;
  const h=items.length*RH+6;
  let s='<svg viewBox="0 0 '+W+' '+h+'" role="img" aria-label="'+esc(label)+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<line class="cbase" x1="'+X0+'" y1="2" x2="'+X0+'" y2="'+(h-4)+'"/>';
  items.forEach((it,k)=>{
    const y=4+k*RH,w=it.v/max*BW;
    s+='<text class="ct" x="0" y="'+(y+13)+'"><title>'+esc(it.l)+'</title>'+esc(trunc(it.l,17))+'</text>';
    s+='<rect class="cb'+(it.oth?' oth':'')+'" x="'+X0+'" y="'+y+'" width="'+w.toFixed(1)+'" height="16"/>';
    s+='<text class="cv" x="'+(X0+w+5).toFixed(1)+'" y="'+(y+13)+'">'+it.v+'</text>';
  });
  return s+'</svg>';
}
function vbars(counts,mes){
  const max=Math.max(...counts.map(c=>c.v),1),slot=W/counts.length,BW=40,BASE=128,MH=100;
  let s='<svg viewBox="0 0 '+W+' 176" role="img" aria-label="Alertas por mês" xmlns="http://www.w3.org/2000/svg">';
  s+='<line class="cbase" x1="0" y1="'+BASE+'" x2="'+W+'" y2="'+BASE+'"/>';
  counts.forEach((c,k)=>{
    const h=c.v/max*MH,x=k*slot+(slot-BW)/2,part=c.m==='Outubro';
    let cls='cb'; if(mes&&c.m!==mes) cls+=' mute'; else if(part) cls+=' part';
    s+='<rect class="'+cls+'" x="'+x.toFixed(1)+'" y="'+(BASE-h).toFixed(1)+'" width="'+BW+'" height="'+h.toFixed(1)+'"/>';
    s+='<text class="cv" text-anchor="middle" x="'+(x+BW/2)+'" y="'+(BASE-h-5).toFixed(1)+'">'+c.v+'</text>';
    s+='<text class="ct" text-anchor="middle" x="'+(x+BW/2)+'" y="'+(BASE+16)+'">'+c.m+'</text>';
    if(part) s+='<text class="ct" text-anchor="middle" x="'+(x+BW/2)+'" y="'+(BASE+30)+'">parcial</text>';
  });
  return s+'</svg>';
}
function topN(rows,key,n,map,otherLabel){
  const m=new Map();rows.forEach(a=>{const k=map?map(a[key]):(a[key]||'Sem informação');m.set(k,(m.get(k)||0)+1);});
  const arr=[...m].map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v||a.l.localeCompare(b.l,'pt-BR'));
  if(otherLabel&&arr.length>n){const rest=arr.slice(n).reduce((s,x)=>s+x.v,0);return arr.slice(0,n).concat([{l:otherLabel,v:rest,oth:true}]);}
  return arr.slice(0,n);
}
function renderGeral(){
  const mes=$('g-mes').value;
  const rows=data.filter(a=>!mes||a.mes===mes);
  const cnt=f=>rows.filter(f).length,T=rows.length;
  const pc=n=>T?Math.round(n/T*100)+'% do total':'—';
  const k=[['Total de alertas',T,mes||'junho a outubro'],['Ofertados',cnt(a=>a.ofertado==='Sim'),pc(cnt(a=>a.ofertado==='Sim'))],['Suspeitos',cnt(a=>a.suspeito==='Sim'),pc(cnt(a=>a.suspeito==='Sim'))],['Com aposta',cnt(a=>a.com_aposta==='Sim'),pc(cnt(a=>a.com_aposta==='Sim'))],['Em análise',cnt(a=>a.status==='Em Análise'),pc(cnt(a=>a.status==='Em Análise'))]];
  $('kpis').innerHTML=k.map(x=>'<div class="kpi"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="p">'+x[2]+'</div></div>').join('');
  $('g-hint').textContent='Considera as alterações feitas nesta sessão. O mês é o da planilha.';
  const counts=MESES.map(m=>({m,v:data.filter(a=>a.mes===m).length}));
  const card=(t,note,body)=>'<section class="card"><h3>'+t+'</h3><p class="note">'+note+'</p>'+body+'</section>';
  $('charts').innerHTML=
    card('Alertas por mês','Todos os meses; Outubro é parcial (dados até 02/10/2026).',vbars(counts,mes))+
    card('Alertas por esporte','Top 6 e demais agrupados em Outros.',hbars(topN(rows,'esporte',6,esp,'Outros'),'Alertas por esporte'))+
    card('Top 8 países','Países ou regiões, como vêm da Sportradar.',hbars(topN(rows,'pais',8),'Top 8 países'))+
    card('Top 6 mercados','Mercados como vêm da planilha.',hbars(topN(rows,'mercado',6,x=>x||'Sem mercado'),'Top 6 mercados'));
}

$('subh').textContent='Dados fictícios para demonstração · '+data.length+' alertas';
initFilters();
state.sel=sorted()[0].i;
renderAll();updChg();
</script>
